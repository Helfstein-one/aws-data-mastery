<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Liquid Gradient -->
    <linearGradient id="flaskLiquidGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    
    <!-- Glass Highlight Gradient -->
    <linearGradient id="flaskGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="flaskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#flaskShadow)">
    <!-- Liquid Content -->
    <path d="M22,34 L42,34 L52,52 A4,4 0 0,1 48,58 L16,58 A4,4 0 0,1 12,52 Z" fill="url(#flaskLiquidGrad)"/>
    
    <!-- Bubbles -->
    <circle cx="28" cy="46" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="36" cy="50" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="24" cy="54" r="1.5" fill="#ffffff" opacity="0.7"/>

    <!-- Flask Glass Outline -->
    <path d="M26,8 L26,24 L10,50 C8,54 11,60 16,60 L48,60 C53,60 56,54 54,50 L38,24 L38,8 M22,8 L42,8" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Glass Highlight -->
    <path d="M15,50 L28,28 L28,12" fill="none" stroke="url(#flaskGlass)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
