<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | AWS Data Mastery</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;0,900;1,300&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta property="og:title" content="Página não encontrada | AWS Data Mastery">
  <meta property="og:description" content="A página que você está procurando não existe ou foi movida.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <style>
    .not-found-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 40px 20px;
    }
    .glitch-text {
      font-family: 'Fraunces', serif;
      font-size: 8rem;
      font-weight: 900;
      color: var(--spark);
      margin: 0;
      line-height: 1;
      text-shadow: 4px 4px 0px rgba(0,0,0,0.5);
    }
    .not-found-desc {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 24px auto 40px;
    }
    .return-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
      border-radius: 99px;
      background: linear-gradient(135deg, var(--spark), var(--spark-dark));
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
    }
    .return-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(22, 163, 74, 0.4);
    }
  </style>
</head>
<body>

<button id="hamburger" onclick="toggleNav()">☰</button>
<nav id="sidebar"></nav>

<div id="main">
  <div class="not-found-container">
    <h1 class="glitch-text">404</h1>
    <h2 style="font-size: 2rem; margin-top: 16px;">Pipeline Quebrado!</h2>
    <p class="not-found-desc">
      A página que você está procurando parece ter sido consumida por um nó corrompido no cluster ou caiu em uma Dead Letter Queue.
    </p>
    <a href="index.html" class="return-btn">
      <span>🏠 Voltar ao Início</span>
    </a>
  </div>
</div>

<script src="js/sidebar-loader.js"></script>
<script>
  function toggleNav() {
    var sb = document.getElementById('sidebar');
    var main = document.getElementById('main');
    var hb = document.getElementById('hamburger');
    if (sb) {
      if (sb.classList.contains('closed')) {
        sb.classList.remove('closed');
        if (main) main.classList.remove('sidebar-closed');
        if (hb) hb.innerHTML = '✕';
      } else {
        sb.classList.add('closed');
        if (main) main.classList.add('sidebar-closed');
        if (hb) hb.innerHTML = '☰';
      }
    }
  }
</script>
<script src="js/a11y.js"></script>
</body>
</html>
